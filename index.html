<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QYNT // Advanced Web3 Hub</title>
    <style>
        :root {
            --bg-dark: #030712;
            --card-dark: #0f172a;
            --neon-blue: #0ea5e9;
            --neon-green: #10b981;
            --neon-purple: #8b5cf6;
            --text-main: #f8fafc;
            --text-muted: #64748b;
        }
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg-dark);
            background-image: linear-gradient(rgba(14, 165, 233, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(14, 165, 233, 0.03) 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.9), rgba(30, 41, 59, 0.8));
            backdrop-filter: blur(12px);
            border: 1px solid rgba(14, 165, 233, 0.2);
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 0 30px rgba(14, 165, 233, 0.15);
            max-width: 650px;
            width: 100%;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(14, 165, 233, 0.2);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        h1 { margin: 0; font-size: 28px; letter-spacing: 2px; color: var(--text-main); text-shadow: 0 0 10px rgba(14, 165, 233, 0.5); }
        .badge {
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--neon-green);
            border: 1px solid var(--neon-green);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }
        .stat-box {
            background-color: rgba(3, 7, 18, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 8px;
            text-align: left;
        }
        .stat-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; }
        .stat-val { font-size: 18px; font-weight: bold; margin-top: 5px; color: var(--neon-blue); }
        .btn-panel { display: flex; flex-direction: column; gap: 12px; }
        button {
            background: linear-gradient(90deg, #0284c7, #0369a1);
            color: white;
            border: 1px solid rgba(14, 165, 233, 0.4);
            padding: 14px;
            font-size: 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s ease;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        button:hover {
            box-shadow: 0 0 15px rgba(14, 165, 233, 0.6);
            transform: translateY(-1px);
        }
        .console {
            margin-top: 25px;
            background-color: #020617;
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 8px;
            padding: 15px;
            font-size: 12px;
            text-align: left;
            color: #c084fc;
            min-height: 60px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }
        .console-line { color: var(--neon-green); margin-bottom: 4px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>QYNT // PROTOCOL</h1>
            <span class="badge" id="netBadge">BASE_SEPOLIA_ACTIVE</span>
        </div>

        <div class="grid">
            <div class="stat-box">
                <div class="stat-label">System Pool Value</div>
                <div class="stat-val">$0.00 USD</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Total Verified Supply</div>
                <div class="stat-val">18,000,000 QYNT</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Your Wallet Balance</div>
                <div class="stat-val" id="balanceDisplay" style="color: #10b981;">0 QYNT</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Anti-Bot Shield Status</div>
                <div class="stat-val" style="color: #8b5cf6;">ACTIVE // 1%_LIMIT</div>
            </div>
        </div>

        <div class="btn-panel">
            <button id="connectBtn">Initialize Wallet Connection</button>
            <button id="faucetBtn" style="background: linear-gradient(90deg, #475569, #334155); display: none;">Trigger Testnet Faucet (+50,000 QYNT)</button>
        </div>

        <div class="console" id="consoleLogs">
            <div class="console-line">[SYSTEM] Terminal initialized. Waiting for secure user signature...</div>
        </div>
    </div>

    <script>
        const connectBtn = document.getElementById('connectBtn');
        const faucetBtn = document.getElementById('faucetBtn');
        const balanceDisplay = document.getElementById('balanceDisplay');
        const consoleLogs = document.getElementById('consoleLogs');
        
        let currentBalance = 9000000;

        function addLog(message, color = "#c084fc") {
            const time = new Date().toLocaleTimeString();
            consoleLogs.innerHTML += `<div style="color: ${color}">[${time}] ${message}</div>`;
            consoleLogs.scrollTop = consoleLogs.scrollHeight;
        }

        async function initConnection() {
            addLog("Querying browser window for MetaMask node extension...", "#0ea5e9");
            
            setTimeout(() => {
                addLog("Secure signature obtained. Switched to Core System Mode.", "#10b981");
                connectBtn.innerText = "Access Granted // Connected";
                connectBtn.style.background = "linear-gradient(90deg, #047857, #065f46)";
                connectBtn.style.border = "1px solid #10b981";
                
                balanceDisplay.innerText = currentBalance.toLocaleString() + " QYNT";
                faucetBtn.style.display = "block";
                
                addLog(`CRITICAL LOG: Contract QYNTFinalShield loaded successfully at 0x5B38Da6a701c568545dCfcB03FcB875f56beddC4. Creator balance: 9,000,000 QYNT checked.`, "#8b5cf6");
            }, 1200);
        }

        function triggerFaucet() {
            currentBalance += 50000;
            balanceDisplay.innerText = currentBalance.toLocaleString() + " QYNT";
            addLog("FAUCET SUCCESS: Minted +50,000 test QYNT tokens to caller address. Anti-bot checked: OK.", "#10b981");
        }

        connectBtn.addEventListener('click', initConnection);
        faucetBtn.addEventListener('click', triggerFaucet);
    </script>
</body>
</html>
